# All the CI stages
stages:
  - analyze # Health check
  - deploy # Upload to prod server

flutter_analyze:
  image: ghcr.io/cirruslabs/flutter
  stage: analyze
  interruptible: true

  before_script:
    - cd frontend
    - flutter clean
    - flutter pub get
  script:
    - dart fix --dry-run
    - dart fix --apply
    - flutter analyze --fatal-warnings --no-fatal-infos
  only:
    refs:
      - merge_requests
  tags:
    - docker-executor

# To run this job you should define the following variables:
# - PROD_USERNAME
# - PROD_HOST

deploy_web:
  stage: deploy
  when: manual
  interruptible: false

  before_script:
    - ls ./yandex_cloud/ || curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
    - yc config set service-account-key $YC_AUTHORIZED_KEYS
    - yc container registry configure-docker
    - ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts

  # TODO: move id of registry to the secrets
  script:
    - cd frontend
    - docker build -t frontend .
    - docker tag frontend cr.yandex/crp08k5ngpk2phfn7dum/frontend
    - docker push cr.yandex/crp08k5ngpk2phfn7dum/frontend

    - cd ..
    # Copy actual docker-compose.yaml to prod server
    - scp -i $SSH_PRIVATE_KEY ./docker-compose.yaml $PROD_USERNAME@$PROD_HOST:/home/$PROD_USERNAME

    # Copy nginx folder to prod server
    - scp -i $SSH_PRIVATE_KEY -r ./nginx $PROD_USERNAME@$PROD_HOST:/home/$PROD_USERNAME

    # and run docker compose up for new image (sent deploy signal to prod server)
    - ssh -i $SSH_PRIVATE_KEY $PROD_USERNAME@$PROD_HOST 'docker compose up'

  tags:
    - shell-executor
