openapi: "3.0.2"
info:
    title: LMS API
    version: "1.0"
servers:
    -   url: http://localhost:8080/
tags:
    - name: User administration
    - name: Auth
    - name: Courses catalog
    - name: Courses administration
    - name: Lessons catalog
    - name: Materials catalog
    - name: Tasks catalog
    - name: Submissions
components:
    schemas:
        user_role:
            type: string
            enum:
                - student
                - teacher
                - admin
        user_type:
            type: string
            enum:
                - anonymous
                - general
                - super
        status_code:
            type: string
            enum:
                - not_sent
                - submitted
                - in_review
                - reviewed
                - completed
        user_data:
            type: object
            properties:
                name:
                    description: user name
                    type: string
                surname:
                    description: user surname
                    type: string
                middle_name:
                    description: user middle_name
                    type: string
            required:
                - type 
                - name
                - surname
                - middle_name
        user:
            type: object
            properties:
                id: 
                    description: user id
                    type: string
                type:
                    description: user type
                    $ref: '#/components/schemas/user_role'
                name:
                    description: user name
                    type: string
                surname:
                    description: user surname
                    type: string
                middle_name:
                    description: user middle_name
                    type: string
            required:
                - id
                - type
                - name
                - surname
                - middle_name
        student:
            allOf:
                - $ref: '#/components/schemas/user'
        teacher:
            allOf:
                - $ref: '#/components/schemas/user'
        admin:
            allOf:
                - $ref: '#/components/schemas/user'
        course:
            type: object
            properties:
                id:
                    description: course identifier
                    type: string
                title:
                    description: course title
                    type: string
                start_ts:
                    description: course beginning time
                    type: string
                    format: date-time
                end_ts:
                    description: course ending time
                    type: string
                    format: date-time
                description:
                    description: course description
                    type: string
                author_id:
                    description: course author identifier
                    type: string
            required:
                - id
                - title
                - description
                - author_id
        lesson:
            type: object
            properties:
                id:
                    description: lesson identifier
                    type: string
                title:
                    description: lesson title
                    type: string
                description:
                    description: lesson description
                    type: string
                author_id:
                    description: lesson author identifier
                    type: string
            required:
                - id
                - title
                - description
                - author_id
        material:
            type: object
            properties:
                id:
                    description: material identifier
                    type: string
                title:
                    description: material title
                    type: string
                content_link:
                    description: material content link
                    type: string
                author_id:
                    description: material author identifier
                    type: string
            required:
                - id
                - title
                - content_link
                - author_id
        task:
            type: object
            properties:
                id:
                    description: task identifier
                    type: string
                title:
                    description: task title
                    type: string
                content_link:
                    description: task content link
                    type: string
                author_id:
                    description: task author identifier
                    type: string
            required:
                - id
                - title
                - content_link
                - author_id
        sent_submission:
            type: object
            properties:
                content_link:
                    description: submission content link
                    type: string
            required:
                - content_link
        accepted_submission:
            type: object
            properties:
                id:
                    description: task identifier
                    type: string
                content_link:
                    description: submission content link
                    type: string
                sent_ts:
                    description: submission acceptance time
                    type: string
                    format: date-time
            required:
                - id
                - content_link
                - sent_ts
        user_course:
            type: object
            properties:
                user_id:
                    description: user id
                    type: string
                course_id:
                    description: course id
                    type: string
                user_role:
                    description: user role on this course
                    $ref: '#/components/schemas/user_role'
            required:
                - user_id
                - course_id
                - user_role
    responses:
        UnauthorizedError:
            description: X-Ya-User-Ticket key is missing or invalid
    securitySchemes:
        UserTicketAuth:
            type: apiKey
            in: header
            name: X-Ya-User-Ticket

paths:
    /register:
        post:
            description: create new user
            tags: 
                - Auth
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                password:
                                    type: string
                            required:
                                - email
                                - password
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        type: string
    /login:
        post:
            description: login to system via credentials
            tags: 
                - Auth
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                password:
                                    type: string
                            required:
                                - email
                                - password
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        type: string
    /v1/update/user_name:
        put:
            description: update self name
            tags: 
                - User administration
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user_data'
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user'
                '400':
                    description: invalid input parameters
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
    /v1/user/{id}/type/change:
        put:
            description: update type of user by id
            tags: 
                - User administration
            parameters:
                -   name: id
                    in: path
                    description: user id
                    required: true
                    schema:
                        type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                role:
                                    description: new user type
                                    $ref: '#/components/schemas/user_type'
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user'
                '400':
                    description: invalid input parameters
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
    /v1/user/add/to_course/{id}:
        post:
            description: add user (himself/herself) to course
            tags: 
                - User administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user_course'
                '400':
                    description: invalid input parameters
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
    /v1/user/leave/course/{id}:
        delete:
            description: leave course
            tags: 
                - User administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user_course'
                '400':
                    description: invalid input parameters
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
    /v1/user/{user_id}/add/to_course/{course_id}:
        post:
            description: add user by user_id to course by course_id
            tags: 
                - User administration
            parameters:
                -   name: user_id
                    in: path
                    description: User id
                    required: true
                    schema:
                        type: string
                -   name: course_id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user'
                '400':
                    description: invalid input parameters
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
    /v1/course/create:
        post:
            description: creates new course
            tags: 
                - Courses catalog
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                title:
                                    description: course title
                                    type: string
                                start_ts:
                                    description: course beginning time
                                    type: string
                                    format: date-time
                                end_ts:
                                    description: course ending time
                                    type: string
                                    format: date-time
                                description:
                                    description: course description
                                    type: string
                            required:
                                - title
                                - description
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/course'
                '400':
                    description: invalid input parameters
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
    /v1/courses:
        get:
            description: list all courses
            tags: 
                - Courses catalog
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/course'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"                                            
    /v1/course/{id}:
        get:
            description: get course by its identifier
            tags: 
                - Courses catalog
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    course:
                                        $ref: '#/components/schemas/course'
                                    roles_array:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/user_role'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"                                            
                '404':
                    description: course is not found
        delete:
            description: delete course by identifier
            tags: 
                - Courses catalog
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        description: identifier of deleted course
                                        type: string
                                required:
                                    - id
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
        put:
            description: change course by identifier
            tags: 
                - Courses catalog
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                title:
                                    description: course title
                                    type: string
                                start_ts:
                                    description: course beginning time
                                    type: string
                                    format: date-time
                                end_ts:
                                    description: course ending time
                                    type: string
                                    format: date-time
                                description:
                                    description: course description
                                    type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/course'
                '400':
                    description: invalid input parameters
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
    /v1/course/{id}/students:
        get:
            description: get students of course by its identifier
            tags: 
                - Courses administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/student'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
    /v1/course/{id}/teachers:
        get:
            description: get teachers of course by its identifier
            tags: 
                - Courses administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/teacher'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
    /v1/course/{id}/admins:
        get:
            description: get admins of course by its identifier
            tags: 
                - Courses administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/admin'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
    /v1/course/{id}/lessons:
        get:
            description: get lessons of course by its identifier
            tags: 
                - Courses administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/lesson'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
    /v1/course/{id}/lessons_ids:
        get:
            description: get lessons' id of course by its identifier
            tags: 
                - Courses administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id:
                                                    description: lesson id
                                                    type: string
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
    /v1/course/{id}/materials:
        get:
            description: get materials of course by its identifier
            tags: 
                - Courses administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/material'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
    /v1/course/{id}/tasks:
        get:
            description: get tasks of course by its identifier
            tags: 
                - Courses administration
            parameters:
                -   name: id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/task'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course is not found
    /v1/course/{course_id}/add_lesson:
        post:
            description: add lesson to course by identifiers
            tags: 
                - Courses administration
            parameters:
                -   name: course_id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                lesson_id:
                                    description: lesson id
                                    type: string
                            required:
                                - lesson_id
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course or lesson is not found
    /v1/course/{course_id}/lesson/{lesson_id}:
        delete:
            description: remove lesson from course by identifiers
            tags: 
                - Courses administration
            parameters:
                -   name: course_id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
                -   name: lesson_id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        description: identifier of deleted lesson
                                        type: string
                                required:
                                    - id
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course or lesson is not found
    /v1/lesson/create:
        post: 
            description: creates new lesson
            tags: 
                - Lessons catalog
            requestBody:
                required: true
                content: 
                    application/json: 
                        schema:
                            type: object
                            properties:
                                title: 
                                    description: lesson title
                                    type: string
                                description: 
                                    description: lesson description
                                    type: string
                            required:
                                - title
                                - description
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/lesson'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '400':
                    description: invalid input parameters
    /v1/lessons:                
        get:
            description: list all lessons
            tags: 
                - Lessons catalog
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/lesson'      
                '401':
                    $ref: "#/components/responses/UnauthorizedError"                 
    /v1/lesson/{id}:
        get:
            description: get lesson by its identifier
            tags: 
                - Lessons catalog
            parameters:
                -   name: id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/lesson'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: lesson is not found
        delete:
            description: delete lesson by identifier
            tags: 
                - Lessons catalog
            parameters:
                -   name: id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        description: identifier of deleted lesson
                                        type: string
                                required:
                                    - id
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: lesson is not found
        put:
            description: change lesson by identifier
            tags: 
                - Lessons catalog
            parameters:
                -   name: id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                title: 
                                    description: lesson title
                                    type: string
                                description: 
                                    description: lesson description
                                    type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/lesson'
                '400':
                    description: invalid input parameters
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: lesson is not found
    /v1/lesson/{id}/materials:
        get: 
            description: get materials of lessson by its identifier
            tags: 
                - Lessons catalog
            parameters:
                -   name: id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/material'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: lesson is not found
    /v1/lesson/{id}/tasks:
        get: 
            description: get tasks of lessson by its identifier
            tags: 
                - Lessons catalog
            parameters:
                -   name: id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/task'
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: lesson is not found
    /v1/course/{course_id}/add_material:
        post:
            description: add lesson to course by identifiers
            tags:
                - Courses administration
            parameters:
                -   name: course_id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                lesson_id:
                                    description: lesson id
                                    type: string
                                material_id:
                                    description: material id
                                    type: string
                            required:
                                - lesson_id
                                - material_id
            security:
                -   UserTicketAuth: [ ]
            responses:
                '200':
                    description: OK
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    description: course or lesson or material is not found
    /v1/course/{course_id}/add_task:
        post:
            description: add lesson to course by identifiers
            tags:
                - Courses administration
            parameters:
                -   name: course_id
