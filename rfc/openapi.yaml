                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/task'
                '404':
                    description: lesson is not found
    /v1/course/{course_id}/lesson/{lesson_id}/add_material/{material_id}:
        post:
            description: add lesson to course by identifiers
            parameters:
                -   name: course_id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
                -   name: lesson_id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
                -   name: material_id
                    in: path
                    description: Material id
                    required: true
                    schema:
                        type: string
            responses:
                '200':
                    description: OK
                '404':
                    description: course or lesson or material is not found
    /v1/course/{course_id}/lesson/{lesson_id}/add_task/{task_id}:
        post:
            description: add lesson to course by identifiers
            parameters:
                -   name: course_id
                    in: path
                    description: Course id
                    required: true
