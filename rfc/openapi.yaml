                        type: string
                -   name: lesson_id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
                -   name: task_id
                    in: path
                    description: Task id
                    required: true
                    schema:
                        type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                deadline:
                                    description: task perfomance deadline 
                                    type: string
                                    format: date-time
                                max_points:
                                    description: maximum points for task
                                    type: integer
            responses:
                '200':
                    description: OK
                '400':
                    description: invalid input parameters
                '404':
                    description: course or lesson or task is not found
    /v1/course/{course_id}/lesson/{lesson_id}/change_task/{task_id}:
        put:
            description: change task parts of course by identifiers
            parameters:
                -   name: course_id
                    in: path
                    description: Course id
                    required: true
                    schema:
                        type: string
                -   name: lesson_id
                    in: path
                    description: Lesson id
                    required: true
                    schema:
                        type: string
                -   name: task_id
                    in: path
