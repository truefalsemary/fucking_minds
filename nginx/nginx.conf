events {}

# Конфигурация сервера
http {
    server {
        listen 80;
        server_name localhost;  # Можно заменить на домен

        # Расположение статического веб-приложения
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Расположение API
        # location /api/ {
        #     proxy_pass http://backend:5000;  # Имя сервиса и порт, указанные в docker-compose.yml
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }
}